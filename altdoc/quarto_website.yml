project:
  type: website
  output-dir: ../docs/

website:
  title: "$ALTDOC_PACKAGE_NAME"
  site-url: https://mdmanurung.github.io/bridgenorm/
  repo-url: https://github.com/mdmanurung/bridgenorm
  navbar:
    search: true
    left:
      - text: Home
        file: index.md
      - text: Get started
        file: vignettes/bridgenorm.Rmd
      # Reference opens bn_fit(), the main function; the sidebar lists the rest.
      - text: Reference
        file: man/bn_fit.qmd
      - text: News
        file: $ALTDOC_NEWS
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.md
      - section: $ALTDOC_VIGNETTE_BLOCK
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: Changelog
        file: $ALTDOC_CHANGELOG
      - text: License
        file: $ALTDOC_LICENSE
      - text: Licence
        file: $ALTDOC_LICENCE
      - text: Code of conduct
        file: $ALTDOC_CODE_OF_CONDUCT
      - text: Citation
        file: $ALTDOC_CITATION

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    code-link: true
